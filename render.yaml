services:
  - type: web
    name: signal-clone
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATA_DIR
        value: /var/data/signal
      - key: FRONTEND_DIST
        value: /app/frontend/out
      - key: SEED_DEMO
        value: "1"
      - key: DEMO_OTP
        value: "123456"
    disk:
      name: signal-data
      mountPath: /var/data
      sizeGB: 1
